<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Chatify AI</title>
  <meta name="description" content="Reset your Chatify AI password securely.">
  <style>
    /* =========================================
       CSS VARIABLES & RESET
       ========================================= */
    :root {
      --bg-base: #030305;
      --card-bg: rgba(12, 12, 20, 0.7);
      --card-border: rgba(255, 255, 255, 0.06);
      --card-glow: rgba(99, 102, 241, 0.15);
      --text-primary: #f0f0ff;
      --text-secondary: #8b8ba7;
      --accent-1: #6366f1;
      --accent-2: #8b5cf6;
      --accent-3: #06b6d4;
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.08);
      --error-border: rgba(239, 68, 68, 0.25);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.08);
      --success-border: rgba(16, 185, 129, 0.25);
      --radius-sm: 14px;
      --radius-lg: 28px;
      --transition-fast: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    /* =========================================
       ANIMATED BACKGROUND
       ========================================= */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, #030305 0%, #0a0a14 100%);
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: 
        linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridFloat 20s linear infinite;
    }

    @keyframes gridFloat {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.6;
      z-index: -1;
      animation: orbFloat 15s ease-in-out infinite;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      top: -150px;
      left: -100px;
      background: radial-gradient(circle, var(--accent-1), transparent 70%);
      animation-delay: 0s;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      bottom: -100px;
      right: -100px;
      background: radial-gradient(circle, var(--accent-2), transparent 70%);
      animation-delay: -5s;
    }

    .orb-3 {
      width: 350px;
      height: 350px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--accent-3), transparent 70%);
      opacity: 0.3;
      animation-delay: -10s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }

    /* =========================================
       PARTICLES
       ========================================= */
    .particles {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(99, 102, 241, 0.6);
      border-radius: 50%;
      animation: particleFloat 10s linear infinite;
      box-shadow: 0 0 10px var(--accent-1);
    }

    .particle:nth-child(1) { top: 20%; left: 10%; animation-duration: 8s; }
    .particle:nth-child(2) { top: 60%; left: 85%; animation-duration: 12s; background: rgba(139, 92, 246, 0.6); box-shadow: 0 0 10px var(--accent-2); }
    .particle:nth-child(3) { top: 30%; left: 70%; animation-duration: 10s; background: rgba(6, 182, 212, 0.6); box-shadow: 0 0 10px var(--accent-3); }
    .particle:nth-child(4) { top: 80%; left: 20%; animation-duration: 14s; }
    .particle:nth-child(5) { top: 45%; left: 50%; animation-duration: 9s; background: rgba(139, 92, 246, 0.6); box-shadow: 0 0 10px var(--accent-2); }
    .particle:nth-child(6) { top: 10%; left: 60%; animation-duration: 11s; background: rgba(6, 182, 212, 0.6); box-shadow: 0 0 10px var(--accent-3); }

    @keyframes particleFloat {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
    }

    /* =========================================
       LAYOUT
       ========================================= */
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      width: 100%;
      position: relative;
    }

    .auth-card {
      background: var(--card-bg);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 480px;
      position: relative;
      animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px) scale(0.98);
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.03),
        0 32px 64px -16px rgba(0, 0, 0, 0.7),
        0 0 120px -20px var(--card-glow),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
    }

    .auth-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: var(--radius-lg);
      padding: 1px;
      background: linear-gradient(
        135deg,
        rgba(99, 102, 241, 0.3),
        rgba(139, 92, 246, 0.1),
        rgba(6, 182, 212, 0.3)
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.5;
      transition: opacity var(--transition-fast);
    }

    .auth-card:hover::before {
      opacity: 1;
    }

    @keyframes cardEntrance {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* =========================================
       BRANDING & LOGO
       ========================================= */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2.5rem;
      position: relative;
    }

    .logo img {
      height: 56px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 20px rgba(99, 102, 241, 0.3));
      transition: transform var(--transition-bounce), filter var(--transition-fast);
    }

    .logo:hover img {
      transform: scale(1.05);
      filter: drop-shadow(0 6px 30px rgba(99, 102, 241, 0.5));
    }

    .logo::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(99, 102, 241, 0.5),
        rgba(139, 92, 246, 0.5),
        rgba(6, 182, 212, 0.5),
        transparent
      );
      animation: linePulse 3s ease-in-out infinite;
    }

    @keyframes linePulse {
      0%, 100% { opacity: 0.5; transform: translateX(-50%) scaleX(1); }
      50% { opacity: 1; transform: translateX(-50%) scaleX(1.1); }
    }

    /* =========================================
       TYPOGRAPHY
       ========================================= */
    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.75rem;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, #c7c7d9 50%, #8b8ba7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 2px 20px rgba(255, 255, 255, 0.1);
    }

    .subtitle {
      color: var(--text-secondary);
      text-align: center;
      font-size: 0.938rem;
      margin-bottom: 2.5rem;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    /* =========================================
       FORM ELEMENTS
       ========================================= */
    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.813rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="email"] {
      width: 100%;
      padding: 1rem 1.25rem;
      padding-left: 3rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 1rem;
      transition: all var(--transition-fast);
      outline: none;
      font-family: inherit;
    }

    input[type="email"]::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      transition: color var(--transition-fast);
    }

    input[type="email"]:focus {
      border-color: var(--accent-1);
      box-shadow: 
        0 0 0 3px rgba(99, 102, 241, 0.15),
        0 0 30px -5px rgba(99, 102, 241, 0.2),
        inset 0 0 20px rgba(99, 102, 241, 0.03);
      background: rgba(0, 0, 0, 0.5);
    }

    input[type="email"]:focus + .input-icon,
    input[type="email"]:focus ~ .input-icon {
      color: var(--accent-1);
    }

    input[type="email"].invalid {
      border-color: var(--error);
      box-shadow: 
        0 0 0 3px rgba(239, 68, 68, 0.12),
        0 0 20px -5px rgba(239, 68, 68, 0.15);
    }

    /* Autofill override */
    input[type="email"]:-webkit-autofill,
    input[type="email"]:-webkit-autofill:hover, 
    input[type="email"]:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text-primary);
      -webkit-box-shadow: 0 0 0px 1000px rgba(10, 10, 20, 0.95) inset;
      transition: background-color 5000s ease-in-out 0s;
      caret-color: var(--text-primary);
    }

    .error-message {
      color: var(--error);
      font-size: 0.813rem;
      margin-top: 0.5rem;
      min-height: 1.2em;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .error-message svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* =========================================
       BUTTON
       ========================================= */
    button[type="submit"] {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 50%, var(--accent-3) 100%);
      background-size: 200% 200%;
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
      overflow: hidden;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 
        0 4px 15px rgba(99, 102, 241, 0.3),
        0 0 40px -10px rgba(139, 92, 246, 0.4);
      animation: gradientShift 5s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    button[type="submit"]::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.2),
        transparent
      );
      transition: left 0.6s ease;
    }

    button[type="submit"]:hover:not(:disabled)::before {
      left: 100%;
    }

    button[type="submit"]:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 
        0 8px 25px rgba(99, 102, 241, 0.4),
        0 0 60px -10px rgba(139, 92, 246, 0.5);
    }

    button[type="submit"]:active:not(:disabled) {
      transform: translateY(0);
    }

    button[type="submit"]:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .loader {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    button[type="submit"].loading .loader {
      display: block;
    }

    button[type="submit"].loading .btn-text {
      opacity: 0.9;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* =========================================
       MESSAGES
       ========================================= */
    .form-message {
      margin-top: 1.5rem;
      padding: 1rem 1.25rem;
      border-radius: var(--radius-sm);
      font-size: 0.938rem;
      line-height: 1.5;
      display: none;
      animation: fadeIn 0.5s ease forwards;
      border: 1px solid;
    }

    .form-message.show {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .form-message svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .form-message.success {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: #34d399;
      box-shadow: 0 0 30px -10px rgba(16, 185, 129, 0.3);
    }

    .form-message.error {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: #f87171;
      box-shadow: 0 0 30px -10px rgba(239, 68, 68, 0.3);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* =========================================
       LINKS
       ========================================= */
    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      text-align: center;
      margin-top: 2rem;
      padding: 0.75rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.938rem;
      font-weight: 500;
      transition: all var(--transition-fast);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
    }

    .back-link:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.06);
      transform: translateY(-1px);
    }

    .back-link svg {
      width: 16px;
      height: 16px;
      transition: transform var(--transition-fast);
    }

    .back-link:hover svg {
      transform: translateX(-3px);
    }

    /* =========================================
       FOOTER
       ========================================= */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.813rem;
      letter-spacing: 0.02em;
    }

    /* =========================================
       ACCESSIBILITY & REDUCED MOTION
       ========================================= */
    :focus-visible {
      outline: 2px solid var(--accent-1);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* =========================================
       RESPONSIVE LAYOUT
       ========================================= */
    @media (max-width: 480px) {
      .auth-card {
        padding: 2.5rem 1.75rem;
        border-radius: 24px;
      }
      
      h1 {
        font-size: 1.5rem;
      }

      .logo img {
        height: 48px;
      }

      input[type="email"] {
        padding: 0.875rem 1rem;
        padding-left: 2.75rem;
      }

      button[type="submit"] {
        padding: 0.875rem;
      }
    }

    @media (max-width: 360px) {
      .auth-card {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Background -->
  <div class="bg-canvas" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>
  <div class="particles" aria-hidden="true">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <main class="auth-container" id="main-content">
    <section class="auth-card" aria-labelledby="heading">
      
      <div class="logo">
        <img src="image.png" alt="Chatify AI Logo" width="56" height="56">
      </div>

      <h1 id="heading">Forgot Password?</h1>
      <p class="subtitle">Enter your email address and we'll send you a link to securely reset your password.</p>

      <form id="forgot-password-form" novalidate>
        <div class="form-group" id="form-fields">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              autocomplete="email" 
              required 
              aria-describedby="email-error"
              aria-invalid="false"
              placeholder="you@example.com"
            >
            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <div id="email-error" class="error-message" aria-live="polite"></div>
        </div>
        
        <button type="submit" id="submit-btn" aria-live="polite">
          <span class="btn-text">Send Reset Link</span>
          <span class="loader" aria-hidden="true"></span>
        </button>
        
        <div id="form-message" class="form-message" role="alert" aria-live="assertive"></div>
      </form>

      <a href="/login" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Login
      </a>

    </section>
  </main>

  <footer>
    &copy; Legend Inc. &mdash; Chatify AI
  </footer>

  <script>
    (function() {
      'use strict';

      const form = document.getElementById('forgot-password-form');
      const emailInput = document.getElementById('email');
      const submitBtn = document.getElementById('submit-btn');
      const emailError = document.getElementById('email-error');
      const formMessage = document.getElementById('form-message');
      const formFields = document.getElementById('form-fields');

      let isSubmitting = false;

      // Standard Email Regex
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      function clearMessages() {
        emailError.innerHTML = '';
        formMessage.innerHTML = '';
        formMessage.className = 'form-message';
        emailInput.classList.remove('invalid');
        emailInput.setAttribute('aria-invalid', 'false');
      }

      function showGlobalMessage(message, type) {
        const iconSvg = type === 'success' 
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
        
        formMessage.innerHTML = iconSvg + '<span>' + message + '</span>';
        formMessage.className = `form-message ${type} show`;
      }

      function showInputError(message) {
        emailError.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><span>' + message + '</span>';
      }

      function validateInput() {
        const email = emailInput.value.trim();
        
        if (!email) {
          showInputError('Email address is required.');
          emailInput.classList.add('invalid');
          emailInput.setAttribute('aria-invalid', 'true');
          emailInput.focus();
          return false;
        }

        if (!emailRegex.test(email)) {
          showInputError('Please enter a valid email address.');
          emailInput.classList.add('invalid');
          emailInput.setAttribute('aria-invalid', 'true');
          emailInput.focus();
          return false;
        }

        return true;
      }

      async function handleSubmit(e) {
        e.preventDefault();
        clearMessages();

        if (!validateInput()) return;
        if (isSubmitting) return;

        const email = emailInput.value.trim();
        isSubmitting = true;

        // UI Loading State
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;
        submitBtn.setAttribute('aria-busy', 'true');

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s timeout

          const response = await fetch('/auth/forgot-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ email: email }),
            signal: controller.signal
          });

          clearTimeout(timeoutId);

          if (response.ok || response.status === 200 || response.status === 202 || response.status === 204) {
            handleSuccess();
          } else if (response.status === 400) {
            showGlobalMessage('Invalid request. Please verify your email address and try again.', 'error');
          } else if (response.status === 429) {
            showGlobalMessage('Too many attempts. Please wait a few moments before trying again.', 'error');
          } else if (response.status >= 500) {
            showGlobalMessage('Our servers are currently unavailable. Please try again shortly.', 'error');
          } else if (response.status === 404) {
            handleSuccess();
          } else {
            showGlobalMessage('An unexpected error occurred. Please try again.', 'error');
          }

        } catch (error) {
          if (error.name === 'AbortError') {
            showGlobalMessage('Request timed out. Please check your connection and try again.', 'error');
          } else {
            showGlobalMessage('Network error. Please check your internet connection.', 'error');
          }
        } finally {
          isSubmitting = false;
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
          submitBtn.setAttribute('aria-busy', 'false');
        }
      }

      function handleSuccess() {
        showGlobalMessage("If an account exists for this email, we'll send password-reset instructions.", 'success');
        
        formFields.style.display = 'none';
        submitBtn.style.display = 'none';
      }

      // Event Listeners
      form.addEventListener('submit', handleSubmit);

      emailInput.addEventListener('input', () => {
        if (emailInput.classList.contains('invalid')) {
          emailError.innerHTML = '';
          emailInput.classList.remove('invalid');
          emailInput.setAttribute('aria-invalid', 'false');
        }
      });

    })();
  </script>
</body>
</html>
